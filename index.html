<!DOCTYPE html>
<html lang="ja">
  <head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy"
    content="
    default-src 'self';
    img-src 'self' https://pvpmanager.dark-gaming.com data:;
    connect-src https://pvpcapi.dark-gaming.com;
    style-src 'self' 'unsafe-inline';
    script-src 'self' 'unsafe-inline';
    object-src 'none';
    base-uri 'none';
    form-action 'none';
  ">
  <title>Eripvp Data</title>
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="stylesheet" href="style.css">
  </head>
<body>

  <header>
    <h1>Eripvp Data</h1>
    <span class="status" id="status"></span>
    <label style="font-size:12px; color:var(--muted);">幅(width)</label>
    <input type="range" id="widthSlider" min="800" max="2200" step="50" value="1400" oninput="setWidth(this.value)">
    <button class="primary" id="refreshBtn" onclick="loadAll()">🔄 データを取得/更新(sync)</button>
  </header>

  <div class="tabs" id="tabs">
    <div class="tab active" data-cat="weapons">武器 (weapons)</div>
    <div class="tab" data-cat="armorPieces">防具 (armorPieces)</div>
    <div class="tab" data-cat="projectiles">弾丸 (projectiles)</div>
    <div class="tab" data-cat="calculator">防具計算機(armor calc)</div>
  </div>

  <div class="toolbar" id="toolbar">
    <input type="text" id="search" placeholder="名前で検索..." oninput="render()">
    <select id="typeFilter" onchange="render()">
      <option value="">全タイプ(all type)</option>
    </select>
    <select id="slotFilter" onchange="render()">
      <option value="">全部位(all slot)</option>
    </select>
    <span class="chip" id="bannedChip" onclick="toggleShowBanned()">Banned Only</span>
    <span class="count" id="count"></span>
  </div>

  <main id="main">
    <div class="empty">「データを取得/更新」を押すと、weapons / armorPieces / projectiles を全ページ自動取得します。</div>
  </main>

  <footer id="footer">データソース: pvpcapi.dark-gaming.com / 画像: pvpmanager.dark-gaming.com</footer>

  <script src="armor-slot-head.js"></script>
  <script src="armor-slot-body.js"></script>
  <script src="armor-slot-legs.js"></script>
  <script src="accessories.js"></script>
  <script src="app.js"></script>
  </body>
</html>
