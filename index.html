<!DOCTYPE html>
<html lang="ja">
  <head>
  <meta charset="UTF-8">
  <title>Eripvp Data</title>
  <style>
    :root{
      --bg:#0f1115; --panel:#171a21; --panel2:#1e2229; --border:#2b303a;
      --text:#e8eaf0; --muted:#9aa2b1; --accent:#5b9dff; --accent2:#3ecf8e;
      --danger:#ff6b6b; --warn:#ffb454; --mono:'SFMono-Regular',Consolas,Menlo,monospace;
    }
    *{box-sizing:border-box;}
    body{
      margin:0; background:var(--bg); color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
      font-size:14px;
    }
    header{
      padding:16px 20px; border-bottom:1px solid var(--border); background:var(--panel);
      display:flex; flex-wrap:wrap; align-items:center; gap:12px; position:sticky; top:0; z-index:20;
    }
    header h1{font-size:16px; margin:0; font-weight:600; white-space:nowrap;}
    .status{font-size:12px; color:var(--muted); margin-right:auto;}
    button{
      background:var(--panel2); color:var(--text); border:1px solid var(--border);
      padding:7px 14px; border-radius:6px; cursor:pointer; font-size:13px;
    }
    button:hover{border-color:var(--accent);}
    button.primary{background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600;}
    button.primary:hover{filter:brightness(1.1);}
    button:disabled{opacity:.5; cursor:not-allowed;}
    input[type=text]{
      background:var(--panel2); border:1px solid var(--border); color:var(--text);
      padding:7px 10px; border-radius:6px; font-size:13px; width:220px;
    }
    select{
      background:var(--panel2); border:1px solid var(--border); color:var(--text);
      padding:7px 10px; border-radius:6px; font-size:13px;
    }
    .tabs{display:flex; gap:4px; padding:10px 20px 0; background:var(--panel); border-bottom:1px solid var(--border);}
    .tab{
      padding:9px 18px; cursor:pointer; border-radius:8px 8px 0 0; font-size:13px;
      color:var(--muted); border:1px solid transparent; border-bottom:none;
    }
    .tab.active{color:var(--text); background:var(--bg); border-color:var(--border); font-weight:600;}
    .toolbar{
      display:flex; flex-wrap:wrap; gap:10px; align-items:center; padding:12px 20px;
      background:var(--panel); border-bottom:1px solid var(--border);
    }
    .toolbar .count{font-size:12px; color:var(--muted); margin-left:auto;}
    .chip{
      font-size:11px; padding:3px 9px; border-radius:999px; border:1px solid var(--border);
      color:var(--muted); cursor:pointer; user-select:none;
    }
    .chip.on{background:var(--accent); border-color:var(--accent); color:#fff;}
    main{padding:0 20px 40px; max-width:1400px; margin:0 auto;}
    table{width:100%; border-collapse:collapse; margin-top:14px; font-size:12px;}
    thead th{
      position:sticky; top:96px; background:var(--panel); text-align:left; padding:7px 8px;
      border-bottom:2px solid var(--border); cursor:pointer; white-space:nowrap; user-select:none;
      color:var(--muted); font-weight:600;
    }
    thead th:hover{color:var(--text);}
    thead th.sorted{color:var(--accent);}
    thead th .arrow{font-size:10px; margin-left:3px; opacity:.8;}
    tbody td{padding:5px 8px; border-bottom:1px solid var(--border); white-space:nowrap; vertical-align:middle;}
    tbody tr:hover{background:var(--panel2);}
    td.name{font-weight:600; white-space:normal; min-width:140px;}
    td.icon{width:32px; padding-right:2px;}
    td.icon img{width:26px; height:26px; object-fit:contain; image-rendering:pixelated; display:block;}
    .num{font-family:var(--mono); text-align:right;}
    .basehint{display:block; font-size:10px; color:var(--muted); font-weight:400;}
    .badge{
      display:inline-block; font-size:11px; padding:2px 8px; border-radius:999px; font-weight:600;
    }
    .badge.melee{background:#3a2a1a; color:#ffb454;}
    .badge.ranged{background:#1a2e3a; color:#5b9dff;}
    .badge.magic{background:#2a1a3a; color:#b47bff;}
    .badge.summon{background:#1a3a2a; color:#3ecf8e;}
    .badge.banned{background:#3a1a1a; color:var(--danger); font-weight:700;}
    .badge.ok{background:#173a24; color:var(--accent2);}
    .diffup{color:var(--accent2);}
    .diffdown{color:var(--danger);}
    .empty{padding:60px 0; text-align:center; color:var(--muted);}
    .panel-msg{
      margin:16px 20px; padding:14px 16px; border-radius:8px; font-size:13px; line-height:1.6;
      border:1px solid var(--danger); background:var(--panel2); color:#ffb4b4;
    }
    .panel-msg code{background:#000; padding:2px 6px; border-radius:4px; font-family:var(--mono); font-size:12px;}
    .spinner{
      width:14px; height:14px; border:2px solid var(--border); border-top-color:var(--accent);
      border-radius:50%; display:inline-block; animation:spin .8s linear infinite; vertical-align:-2px;
    }
    @keyframes spin{to{transform:rotate(360deg);}}
    footer{padding:14px 20px; color:var(--muted); font-size:11px; border-top:1px solid var(--border);}
    .calc-wrap{display:flex; gap:20px; flex-wrap:wrap; margin-top:16px;}
    .calc-set{flex:1; min-width:280px; background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:14px;}
    .calc-set h3{margin:0 0 10px; font-size:14px; font-weight:600;}
    .calc-row{margin-bottom:10px;}
    .calc-row label{display:block; font-size:11px; color:var(--muted); margin-bottom:4px;}
    .calc-row input{width:100%;}
    .calc-piece-icon{display:inline-block; width:18px; height:18px; vertical-align:-4px; margin-right:4px; object-fit:contain; image-rendering:pixelated;}
    .calc-result{margin-top:20px; background:var(--panel); border:1px solid var(--border); border-radius:8px; overflow:hidden;}
    .calc-result table{margin:0; font-size:13px;}
    .calc-result th, .calc-result td{padding:8px 12px;}
    .calc-result thead th{position:static;}
    .calc-diff-pos{color:var(--accent2); font-weight:600;}
    .calc-diff-neg{color:var(--danger); font-weight:600;}
  </style>
  </head>
<body>

  <header>
    <h1>Eripvp Data</h1>
    <span class="status" id="status"></span>
    <label style="font-size:12px; color:var(--muted);">幅(width)</label>
    <input type="range" id="widthSlider" min="800" max="2200" step="50" value="1400" oninput="setWidth(this.value)">
    <button class="primary" id="refreshBtn" onclick="loadAll()">🔄 データを取得/更新(sync)</button>
  </header>

  <div class="tabs" id="tabs">
    <div class="tab active" data-cat="weapons">武器 (weapons)</div>
    <div class="tab" data-cat="armorPieces">防具 (armorPieces)</div>
    <div class="tab" data-cat="projectiles">弾丸 (projectiles)</div>
    <div class="tab" data-cat="calculator">防具計算機(armor calc)</div>
  </div>

  <div class="toolbar" id="toolbar">
    <input type="text" id="search" placeholder="名前で検索..." oninput="render()">
    <select id="typeFilter" onchange="render()">
      <option value="">全タイプ(all type)</option>
    </select>
    <span class="chip" id="bannedChip" onclick="toggleShowBanned()">Bannedも表示</span>
    <span class="count" id="count"></span>
  </div>

  <main id="main">
    <div class="empty">「データを取得/更新」を押すと、weapons / armorPieces / projectiles を全ページ自動取得します。</div>
  </main>

  <footer id="footer">データソース: pvpcapi.dark-gaming.com / 画像: pvpmanager.dark-gaming.com</footer>

  <script>
    const BASE = "https://pvpcapi.dark-gaming.com/api/";
    const IMG_BASE = "https://pvpmanager.dark-gaming.com/img/item-";
    const PAGE_SIZE = 104;
    const CATS = {
      weapons: { endpoint: "weapons", key: "weapons" },
      armorPieces: { endpoint: "armorPieces", key: "armorPieces" },
      projectiles: { endpoint: "projectiles", key: "projectiles" }
    };

    let store = { weapons: {}, armorPieces: {}, projectiles: {} };
    let currentCat = "weapons";
    let sortState = { weapons: {col:"Name", dir:1}, armorPieces:{col:"Name", dir:1}, projectiles:{col:"Name", dir:1} };
    let showBanned = false;

    document.querySelectorAll(".tab").forEach(t => {
      t.addEventListener("click", () => {
        document.querySelectorAll(".tab").forEach(x => x.classList.remove("active"));
        t.classList.add("active");
        currentCat = t.dataset.cat;
        document.getElementById("toolbar").style.display = currentCat === "calculator" ? "none" : "flex";
        if(currentCat !== "calculator"){
          document.getElementById("search").value = "";
          populateTypeFilter();
        }
        render();
      });
    });

    function setWidth(px){
      document.getElementById("main").style.maxWidth = px + "px";
    }

    function toggleShowBanned(){
      showBanned = !showBanned;
      document.getElementById("bannedChip").classList.toggle("on", showBanned);
      render();
    }

    function setStatus(html){ document.getElementById("status").innerHTML = html; }

    async function fetchAllPages(catKey){
      const cfg = CATS[catKey];
      let offset = 0;
      let all = [];
      while(true){
        const url = `${BASE}${cfg.endpoint}/all/${offset}/${PAGE_SIZE}`;
        let res;
        try{
          res = await fetch(url, {mode:"cors"});
        }catch(e){
          throw new Error(`ネットワークエラー: ${url}`);
        }
        if(!res.ok) throw new Error(`HTTPエラー ${res.status}: ${url}`);
        const data = await res.json();
        const list = data[cfg.key] || [];
        all = all.concat(list);
        if(list.length < PAGE_SIZE) break;
        offset += PAGE_SIZE;
        if(offset > 5000) break;
      }
      return all;
    }

    async function loadAll(){
      const btn = document.getElementById("refreshBtn");
      btn.disabled = true;
      setStatus('<span class="spinner"></span> 読み込み中...');
      let errors = [];
      for(const catKey of Object.keys(CATS)){
        try{
          setStatus(`<span class="spinner"></span> 読み込み中 (${catKey})...`);
          const items = await fetchAllPages(catKey);
          const map = {};
          items.forEach(it => { map[it.NetID ?? it._id] = it; });
          store[catKey] = map;
        }catch(e){
          errors.push(`${catKey}: ${e.message}`);
        }
      }
      btn.disabled = false;
      setStatus("");
      if(errors.length){
        showFetchError(errors);
      }
      populateTypeFilter();
      render();
    }

    function showFetchError(errors){
      const main = document.getElementById("main");
      const div = document.createElement("div");
      div.className = "panel-msg";
      div.innerHTML = `直接取得に失敗した項目があるよ<br>
      ${errors.map(e=>`・${e}`).join("<br>")}`;
      main.prepend(div);
    }

    function getColumns(catKey){
      if(catKey === "weapons"){
        return [
          {k:"_icon", label:"", type:"icon"},
          {k:"Name", label:"Name", type:"str"},
          {k:"WeaponType", label:"Type", type:"badge"},
          {k:"CurrentDamage", label:"Damage", type:"effnum", base:"BaseDamage"},
          {k:"MinDamage", label:"Min Damage", type:"num"},
          {k:"MaxDamage", label:"Max Damage", type:"num"},
          {k:"CurrentVelocity", label:"Velocity", type:"effnum", base:"BaseVelocity"},
          {k:"NetID", label:"NetID", type:"num"},
          {k:"Banned", label:"Banned", type:"bool"}
        ];
      }
      if(catKey === "armorPieces"){
        return [
          {k:"_icon", label:"", type:"icon"},
          {k:"Name", label:"名前", type:"str"},
          {k:"CurrentDefense", label:"Defense", type:"effnum", base:"BaseDefense"},
          {k:"CurrentMeleeDamagePercentage", label:"Melee%", type:"effnum", base:"BaseMeleeDamagePercentage"},
          {k:"CurrentMagicDamagePercentage", label:"Magic%", type:"effnum", base:"BaseMagicDamagePercentage"},
          {k:"CurrentRangedDamagePercentage", label:"Ranged%", type:"effnum", base:"BaseRangedDamagePercentage"},
          {k:"CurrentMinionDamagePercentage", label:"Minion%", type:"effnum", base:"BaseMinionDamagePercentage"},
          {k:"NetID", label:"NetID", type:"num"}
        ];
      }
      return [
        {k:"Name", label:"名前", type:"str"},
        {k:"DamageRatio", label:"Dmg 倍率", type:"num"},
        {k:"VelocityRatio", label:"Vel 倍率", type:"num"},
        {k:"MinDamage", label:"Min Damage", type:"num"},
        {k:"MaxDamage", label:"Max Damage", type:"num"},
        {k:"Banned", label:"Banned", type:"bool"}
      ];
    }

    function populateTypeFilter(){
      const sel = document.getElementById("typeFilter");
      sel.innerHTML = "";
      if(currentCat !== "weapons"){
        sel.style.display = "none";
        return;
      }
      sel.style.display = "inline-block";
      const types = new Set();
      Object.values(store.weapons).forEach(w => types.add(w.WeaponType || "不明"));
      const opts = ['<option value="">全タイプ</option>'].concat(
        [...types].sort().map(t => `<option value="${t}">${t}</option>`)
      );
      sel.innerHTML = opts.join("");
    }

    function render(){
      if(currentCat === "calculator"){ renderCalculator(); return; }
      const main = document.getElementById("main");
      const items = Object.values(store[currentCat]);
      if(!items.length){
        main.innerHTML = '<div class="empty">データがないよ。「データを取得/更新」を押してね。</div>';
        document.getElementById("count").textContent = "";
        return;
      }
      const cols = getColumns(currentCat);
      const q = document.getElementById("search").value.trim().toLowerCase();
      const typeF = currentCat === "weapons" ? document.getElementById("typeFilter").value : "";

      let filtered = items.filter(it => {
        if(!showBanned && it.Banned) return false;
        if(q && !(it.Name||"").toLowerCase().includes(q)) return false;
        if(typeF && it.WeaponType !== typeF) return false;
        return true;
      });

      const st = sortState[currentCat];
      filtered.sort((a,b) => {
        let av = a[st.col], bv = b[st.col];
        if(typeof av === "string" || typeof bv === "string"){
          av = (av ?? "").toString().toLowerCase(); bv = (bv ?? "").toString().toLowerCase();
          return av < bv ? -1*st.dir : av > bv ? 1*st.dir : 0;
        }
        av = av ?? 0; bv = bv ?? 0;
        return (av - bv) * st.dir;
      });

      document.getElementById("count").textContent = `${filtered.length} / ${items.length} 件`;

      let html = '<table><thead><tr>';
      cols.forEach(c => {
        if(c.type === "icon"){ html += `<th></th>`; return; }
        const sorted = st.col === c.k;
        const arrow = sorted ? (st.dir === 1 ? "▲" : "▼") : "";
        const align = (c.type === "num" || c.type === "numdiff" || c.type === "effnum") ? "text-align:right;" : "";
        html += `<th style="${align}" class="${sorted?'sorted':''}" onclick="sortBy('${c.k}')">${c.label}<span class="arrow">${arrow}</span></th>`;
      });
      html += '</tr></thead><tbody>';

      filtered.forEach(it => {
        html += '<tr>';
        cols.forEach(c => {
          const v = it[c.k];
          if(c.type === "icon"){
            const src = `${IMG_BASE}${it.NetID}.png`;
            html += `<td class="icon"><img src="${src}" loading="lazy" onerror="this.style.display='none'"></td>`;
          } else if(c.type === "str"){
            html += `<td class="name">${escapeHtml(v ?? "")}</td>`;
          } else if(c.type === "badge"){
            html += `<td><span class="badge ${v||''}">${v||'-'}</span></td>`;
          } else if(c.type === "bool"){
            html += `<td>${v ? '<span class="badge banned">BAN</span>' : '<span class="badge ok">OK</span>'}</td>`;
          } else if(c.type === "num"){
            html += `<td class="num">${v === -1 || v === undefined ? '-' : v}</td>`;
          } else if(c.type === "effnum"){
            const base = it[c.base];
            const shown = v === -1 || v === undefined ? '-' : v;
            let hint = "";
            if(typeof v === "number" && typeof base === "number" && v !== base && base !== -1){
              hint = `<span class="basehint">base ${base}</span>`;
            }
            html += `<td class="num">${shown}${hint}</td>`;
          }
        });
        html += '</tr>';
      });
      html += '</tbody></table>';
      main.innerHTML = html;
    }

    function sortBy(col){
      const st = sortState[currentCat];
      if(st.col === col){ st.dir *= -1; } else { st.col = col; st.dir = 1; }
      render();
    }

    function escapeHtml(s){
      return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
    }

    let calcSelection = { A:{head:null, body:null, legs:null}, B:{head:null, body:null, legs:null} };

    function classifySlot(name){
      const n = (name||"").toLowerCase();
      if(/helmet|headgear|mask|hood|hat\b|cap\b|antlers|horn|headpiece|hairpin|wig/.test(n)) return "head";
      if(/breastplate|chainmail|plate mail|scalemail|scale mail|robe|shirt|jerkin|vest|shell|plating|tunic|torso|dress|\bgi\b/.test(n)) return "body";
      if(/leggings|greaves|pants|trousers|\bleg\b/.test(n)) return "legs";
      return "other";
    }

    function getArmorPool(){
      return Object.values(store.armorPieces).filter(a => showBanned || !a.Banned);
    }

    function renderCalculator(){
      const main = document.getElementById("main");
      const pool = getArmorPool();
      if(!pool.length){
        main.innerHTML = '<div class="empty">先に「データを取得/更新」で防具データを取得してね。</div>';
        return;
      }
      const slots = [["head","頭(head)"],["body","胴(body)"],["legs","足(leg)"]];
      function setPanel(id){
        const rows = slots.map(([slot,label]) => `
          <div class="calc-row">
            <label>${label}</label>
            <input type="text" list="dl-${id}-${slot}" placeholder="名前で検索..." data-set="${id}" data-slot="${slot}" oninput="onCalcInput(this)">
            <datalist id="dl-${id}-${slot}">
              ${pool.filter(a=>classifySlot(a.Name)===slot).sort((a,b)=>a.Name.localeCompare(b.Name)).map(a=>`<option value="${escapeHtml(a.Name)}">`).join("")}
            </datalist>
          </div>`).join("");
        return `<div class="calc-set"><h3>set${id}</h3>${rows}</div>`;
      }
      main.innerHTML = `
        <div class="calc-wrap">
          ${setPanel("A")}
          ${setPanel("B")}
        </div>
        <div class="calc-result" id="calcResult"></div>
      `;
      updateCalcResult();
    }

    function onCalcInput(el){
      const setId = el.dataset.set, slot = el.dataset.slot;
      const val = el.value;
      const pool = getArmorPool();
      const match = pool.find(a => a.Name === val && classifySlot(a.Name) === slot);
      calcSelection[setId][slot] = match || null;
      updateCalcResult();
    }

    function sumStats(sel){
      const pieces = [sel.head, sel.body, sel.legs].filter(Boolean);
      const stats = {Defense:0, Melee:0, Magic:0, Ranged:0, Minion:0};
      pieces.forEach(p=>{
        stats.Defense += p.CurrentDefense || 0;
        stats.Melee += p.CurrentMeleeDamagePercentage || 0;
        stats.Magic += p.CurrentMagicDamagePercentage || 0;
        stats.Ranged += p.CurrentRangedDamagePercentage || 0;
        stats.Minion += p.CurrentMinionDamagePercentage || 0;
      });
      return stats;
    }

    function updateCalcResult(){
      const box = document.getElementById("calcResult");
      if(!box) return;
      const a = sumStats(calcSelection.A);
      const b = sumStats(calcSelection.B);
      const rows = [
        ["防御力 (Defense)", a.Defense, b.Defense],
        ["近接ダメージ% (Melee)", a.Melee, b.Melee],
        ["魔法ダメージ% (Magic)", a.Magic, b.Magic],
        ["遠隔ダメージ% (Ranged)", a.Ranged, b.Ranged],
        ["ミニオンダメージ% (Minion)", a.Minion, b.Minion]
      ];
      function diffClass(x, y){ if(x === y) return ""; return x > y ? "calc-diff-pos" : "calc-diff-neg"; }
      let html = '<table><thead><tr><th>項目</th><th style="text-align:right;">セットA</th><th style="text-align:right;">セットB</th></tr></thead><tbody>';
      rows.forEach(([label, av, bv]) => {
        html += `<tr><td>${label}</td><td class="num ${diffClass(av,bv)}">${av}</td><td class="num ${diffClass(bv,av)}">${bv}</td></tr>`;
      });
      html += '</tbody></table>';
      box.innerHTML = html;
    }

    loadAll();
    </script>
  </body>
</html>
