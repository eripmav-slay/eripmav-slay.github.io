<!DOCTYPE html>
<html lang="ja">
  <head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy"
    content="
    default-src 'self';
    img-src 'self' https://pvpmanager.dark-gaming.com https://tinvapi.dark-gaming.com data:;
    connect-src https://pvpcapi.dark-gaming.com https://tinvapi.dark-gaming.com;
    style-src 'self' 'unsafe-inline';
    script-src 'self';
    object-src 'none';
    base-uri 'none';
    form-action 'none';
  ">
  <title>Eripvp Data</title>
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="stylesheet" href="style.css">
  </head>
<body>

  <div class="topbar">
    <header>
      <h1>Eripvp Data</h1>
      <span class="status" id="status"></span>
      <label style="font-size:12px; color:var(--muted);">幅(width)</label>
      <input type="range" id="widthSlider" min="800" max="2200" step="50" value="1400">
      <button class="primary" id="refreshBtn">データを取得/更新(sync)</button>
    </header>

    <div class="tabs" id="tabs">
      <button type="button" class="tab" data-cat="member">メンバー (member)</button>
      <button type="button" class="tab active" data-cat="weapons">武器 (weapons)</button>
      <button type="button" class="tab" data-cat="armorPieces">防具 (armorPieces)</button>
      <button type="button" class="tab" data-cat="accessories">アクセサリー (accessories)</button>
      <button type="button" class="tab" data-cat="projectiles">弾丸 (projectiles)</button>
      <button type="button" class="tab" data-cat="calculator">防具計算機(armor calc)</button>
    </div>

    <div class="toolbar" id="toolbar">
      <input type="text" id="search" placeholder="名前で検索...">
      <select id="typeFilter">
        <option value="">all type</option>
      </select>
      <select id="slotFilter">
        <option value="">all slot</option>
      </select>
      <button type="button" class="chip" id="bannedChip">Banned Only</button>
      <span class="count" id="count"></span>
    </div>
  </div>

  <main id="main">
    <div class="empty">「データを取得/更新」を押すと、weapons / armorPieces / accessories / projectiles を全件自動取得します。</div>
  </main>

  <!-- 他のタブに切り替えてもDOM(画像含む)を破棄しない、非表示にするだけ -->
  <div id="memberMain" class="member-main" style="display:none;">
    <div class="empty">読み込み中...</div>
  </div>

  <footer id="footer">データソース: pvpcapi.dark-gaming.com / 画像: pvpmanager.dark-gaming.com</footer>

  <script src="loader.js"></script>
  </body>
</html>
